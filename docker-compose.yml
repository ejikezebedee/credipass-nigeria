services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: credipass
      POSTGRES_PASSWORD: credipass
      POSTGRES_DB: credipass
    ports: ["5432:5432"]
    volumes: ["credipass-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credipass -d credipass"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["credipass-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  credipass-postgres:
  credipass-redis:
